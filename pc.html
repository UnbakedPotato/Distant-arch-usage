<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>pc</title>
<script>
document.documentElement.dataset.theme=localStorage.getItem("theme")||"oled";
// DEBUG: true = no password screen (UI only). Set to false to bring the login back.
window.DEBUG_NO_LOGIN=true;
if(window.DEBUG_NO_LOGIN)document.documentElement.setAttribute("data-nologin","");
</script>
<style>
/* ===== themes: everything below uses these variables ===== */
:root{--bg:#000;--bgimg:none;--fg:#fff;--line:#fff;--soft:#3a3a3a;--dim:#8a8a8a;--card:#000;--sheet:#000;--code:#0b0b0b;
--on-bg:#fff;--on-fg:#000;--pill:999px;--rs:14px;--r:18px;--rl:26px;--scrim:rgba(0,0,0,.7);
--font:system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--blur:none;--shadow:none;--glow:none}
/* Liquid Glass: frosted translucent surfaces over a soft colour mesh */
html[data-theme=glass]{--bg:#07081a;
--bgimg:radial-gradient(60% 45% at 12% 8%,#5b3df5aa,transparent 70%),radial-gradient(55% 40% at 92% 24%,#00c2ffaa,transparent 70%),radial-gradient(60% 50% at 72% 96%,#ff4fa3aa,transparent 70%),radial-gradient(50% 40% at 4% 86%,#22d3a0aa,transparent 70%);
--card:rgba(255,255,255,.09);--sheet:rgba(24,26,60,.55);--code:rgba(0,0,0,.28);--line:rgba(255,255,255,.3);--soft:rgba(255,255,255,.16);
--dim:rgba(255,255,255,.62);--on-bg:rgba(255,255,255,.92);--on-fg:#10102a;--rs:18px;--r:24px;--rl:30px;--scrim:rgba(5,6,20,.45);
--blur:blur(22px) saturate(180%);--shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.06),0 8px 24px rgba(0,0,0,.22)}
/* tty: green phosphor, monospace, square corners, scanlines */
html[data-theme=tty]{--fg:#3cff6b;--line:#2bd458;--soft:#14662f;--dim:#1f9d49;--code:#001a07;--on-bg:#3cff6b;--on-fg:#000;
--pill:0;--rs:0;--r:0;--rl:0;--font:var(--mono);--glow:0 0 6px rgba(60,255,107,.5)}
html[data-theme=tty] body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html[data-nologin] #login{display:none!important}
html{height:100%;background-color:var(--bg);background-image:var(--bgimg);background-attachment:fixed}
body{height:100%;margin:0;color:var(--fg);font:16px/1.5 var(--font);text-shadow:var(--glow);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden}
button,input,select,textarea,a.btn{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:var(--pill);font:inherit;padding:8px 14px;text-decoration:none;box-shadow:var(--shadow);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
button,input,a.btn{display:inline-flex;align-items:center;justify-content:center}
input::placeholder,textarea::placeholder{color:var(--dim)}
button,a.btn{cursor:pointer}
button:active,a.btn:active{background:var(--on-bg);color:var(--on-fg);text-shadow:none}
button:disabled{opacity:.3}
button.soft,a.soft,select{border-color:var(--soft)}
.pri,.tab.on,#go,#unlock,#lagent.on{background:var(--on-bg);color:var(--on-fg);border-color:var(--on-bg);text-shadow:none}
.ic{width:40px;height:40px;padding:0;display:grid;place-items:center;flex:none}
#thm{font-size:11px}
header{display:flex;gap:8px;padding:10px;align-items:center}
.tab{flex:1;min-width:0;padding:8px 4px}
.panel{display:none;flex:1;min-height:0;flex-direction:column}
.panel.on{display:flex}
.m,#out,#view,.box,.card,.up,.row .name,details,.tw{background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.empty{color:var(--dim);margin:auto;text-align:center}
/* files */
#bar1{display:flex;gap:8px;padding:0 10px 8px;align-items:center}
#crumb{flex:1;min-width:0;color:var(--dim);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
#acts,#sacts{display:flex;gap:8px;padding:0 10px 8px;flex-wrap:wrap}
#ups{padding:0 10px;display:flex;flex-direction:column;gap:6px}
.up{border:1px solid var(--soft);border-radius:var(--rs);padding:6px 12px;font-size:12px;color:var(--dim)}
.up .bar{height:6px;border:1px solid var(--soft);border-radius:var(--pill);margin-top:4px;overflow:hidden}
.up .bar i{display:block;height:100%;background:var(--on-bg);width:0}
#files{flex:1;overflow-y:auto;padding:4px 10px 12px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px;align-items:stretch}
.row .name{flex:1;min-width:0;text-align:left;justify-content:flex-start;border-color:var(--soft);border-radius:var(--rs);display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:6px 12px}
.row .name span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .name small{color:var(--dim);font-size:11px}
.row .btn,.row button.x{border-radius:var(--rs);border-color:var(--soft);padding:0 14px}
/* screen */
#view{flex:1;min-height:0;margin:0 10px 10px;border:1px solid var(--soft);border-radius:var(--r);overflow:auto;display:flex}
#view img{display:none;max-width:100%;max-height:100%;margin:auto;object-fit:contain}
#view.zoom img{max-width:none;max-height:none;margin:0}
/* terminal */
#out{flex:1;min-height:0;overflow-y:auto;padding:10px 12px;font:13px/1.35 var(--mono);white-space:pre-wrap;word-break:break-all;border:1px solid var(--soft);border-radius:var(--r);margin:0 10px 8px}
#out div{min-height:1.35em}
#keys{display:flex;gap:6px;padding:0 10px 8px;overflow-x:auto}
#keys button{flex:none;padding:6px 12px;border-color:var(--soft);font-size:13px}
#row,#lrow{display:flex;gap:8px;border:1px solid var(--line);border-radius:var(--rl);padding:6px;background:var(--card);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shadow)}
#row{margin:0 10px 10px}
#cmd,#lin{flex:1;min-width:0;border:0;outline:0;background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:0}
#cmd{padding:6px 8px;font:16px var(--mono)}
#row button,#lrow button{box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
#lrow button:not(.pri){border-color:transparent}
.f0{color:#777}.f1{color:#ff6b6b}.f2{color:#7ee787}.f3{color:#e3c06a}.f4{color:#6cb6ff}.f5{color:#d2a8ff}.f6{color:#56d4dd}.f7{color:#e6e6e6}
.f8{color:#999}.f9{color:#ff8e8e}.f10{color:#9bf0a4}.f11{color:#f2d98a}.f12{color:#8ec8ff}.f13{color:#e0c4ff}.f14{color:#7be3ea}.f15{color:#fff}
.b{font-weight:700}
/* LLM */
#lbar{display:flex;gap:8px;padding:0 10px 8px;align-items:center}
#lmodel{flex:1;min-width:0;text-overflow:ellipsis}
#lstats{display:flex;justify-content:space-between;gap:8px;padding:2px 14px 8px;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
#lstats b{color:var(--fg);font-weight:600}
#lnote{display:none;margin:0 12px 8px;padding:6px 12px;border:1px solid var(--soft);border-radius:var(--rs);font-size:12px;color:var(--dim);white-space:pre-wrap;max-height:90px;overflow:auto}
#llog{flex:1;overflow-y:auto;padding:6px 12px 12px;display:flex;flex-direction:column;gap:12px}
.m{border:1px solid var(--soft);border-radius:var(--r);padding:10px 14px;word-wrap:break-word;max-width:92%;min-width:0}
.m.u{align-self:flex-end;border-color:var(--line);border-bottom-right-radius:min(6px,var(--r))}
.m.a{border-bottom-left-radius:min(6px,var(--r))}
.m.t{align-self:flex-start;max-width:100%;font:12px/1.4 var(--mono);padding:6px 10px;border-radius:var(--rs)}
.m.t summary{cursor:pointer;word-break:break-all}
.m.t pre{margin:6px 0 0;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow:auto}
.m.ap{display:flex;flex-direction:column;gap:8px;border-color:var(--line);white-space:pre-wrap;word-break:break-all}
.m.ap div+div{display:flex;gap:8px}
.m img{max-width:100%;display:block;margin-bottom:8px;border-radius:var(--rs);border:1px solid var(--soft)}
.m small{display:block;color:var(--dim);margin-top:6px;font-size:11px}
details{color:var(--dim);font-size:13px;margin-bottom:8px;border:1px solid var(--soft);border-radius:var(--rs);padding:6px 10px}
details summary{cursor:pointer}
.m.t details{margin:0;border:0;padding:0;color:var(--fg);font-size:12px;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.md strong{font-weight:700}
.md code{font:13.5px var(--mono);background:var(--code);border:1px solid var(--soft);border-radius:min(6px,var(--r));padding:1px 5px}
.md pre{margin:8px 0;border:1px solid var(--soft);border-radius:var(--rs);background:var(--code);padding:10px 12px;overflow-x:auto}
.md pre code{background:none;border:0;padding:0;white-space:pre}
.tw{margin:8px 0;border:1px solid var(--soft);border-radius:var(--rs);overflow-x:auto}
.tw table{border-collapse:collapse;width:100%;font-size:14px}
.tw th,.tw td{padding:6px 12px;text-align:left;border-bottom:1px solid var(--soft);border-right:1px solid var(--soft);white-space:nowrap}
.tw th:last-child,.tw td:last-child{border-right:0}
.tw tbody tr:last-child td{border-bottom:0}
.tw th{font-weight:700;background:var(--code)}
#lbarin{padding:8px 10px 10px}
#lprev{display:none;align-items:center;gap:8px;color:var(--dim);font-size:12px;margin:0 4px 8px}
#lprev img{height:44px;border-radius:var(--rs);border:1px solid var(--fg)}
#lrow{align-items:flex-end}
#lin{resize:none;max-height:140px;padding:9px 4px;display:block}
#lsend.stop{background:var(--card);color:var(--fg);border-color:var(--fg)}
.sheet{position:fixed;inset:0;display:none;background:var(--scrim);z-index:5}
.sheet.on{display:block}
.card{position:absolute;background:var(--sheet);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px}
#lset .card{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));border-radius:var(--rl);max-height:85%;overflow-y:auto}
#ldrawer .card{top:0;bottom:0;left:0;width:82%;max-width:340px;border-radius:0 var(--rl) var(--rl) 0;border-left:0;padding-top:calc(16px + env(safe-area-inset-top))}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
textarea.sys{width:100%;border-radius:var(--rs);min-height:90px;resize:vertical;display:block}
input[type=range]{width:100%;padding:0;border:0;accent-color:var(--on-bg);background:none;box-shadow:none}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:var(--pill);padding:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:min(50%,var(--pill));background:var(--fg);transition:transform .15s}
.sw:checked{background:var(--on-bg)}
.sw:checked::after{background:var(--on-fg);transform:translateX(20px)}
#lchats{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:6px}
.ci{display:flex;gap:6px}
.ci button:first-child{flex:1;text-align:left;justify-content:flex-start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-color:var(--soft);border-radius:var(--rs)}
.ci.cur button:first-child{border-color:var(--fg)}
.ci button:last-child{border-radius:var(--rs);border-color:var(--soft);padding:8px 12px}
.hint{color:var(--dim);font-size:12px;margin-top:-6px}
/* login */
#login{position:fixed;inset:0;background-color:var(--bg);background-image:var(--bgimg);z-index:9;display:flex;align-items:center;justify-content:center;padding:24px}
#login .box{width:100%;max-width:340px;border:1px solid var(--line);border-radius:var(--rl);padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
#login input{width:100%}
#lerr{color:var(--dim);font-size:13px;min-height:1.3em}
</style>
</head>
<body>
<header>
  <button class="tab on" id="t-files">Files</button>
  <button class="tab" id="t-term">Term</button>
  <button class="tab" id="t-screen">Screen</button>
  <button class="tab" id="t-llm">LLM</button>
  <button class="ic soft" id="thm" aria-label="Change style">oled</button>
</header>

<section class="panel" id="p-screen">
  <div id="sacts">
    <button id="snap">Screenshot</button>
    <button class="soft" id="live">Live</button>
    <select id="qual" aria-label="Live quality">
      <option value="low">Low</option><option value="med" selected>Medium</option><option value="high">High</option>
    </select>
    <a class="btn soft" id="save" hidden>Save</a>
  </div>
  <div id="view"><div class="empty" id="vmsg">Tap Screenshot or Live</div><img id="shot" alt="Desktop"></div>
</section>

<section class="panel" id="p-llm">
  <div id="lbar">
    <button class="ic soft" id="lmenu" aria-label="Chats">☰</button>
    <select id="lmodel" aria-label="Model"></select>
    <button class="soft" id="lagent" title="Let the model run commands on this PC">Agent</button>
    <button class="ic soft" id="lgear" aria-label="Settings">⚙</button>
  </div>
  <div id="lstats">
    <span>status <b id="lst">–</b></span>
    <span>tokens <b id="ltk">0</b></span>
    <span>avg <b id="lavg">–</b> t/s</span>
    <span>last <b id="llast">–</b> t/s</span>
  </div>
  <div id="lnote"></div>
  <div id="llog"></div>
  <div id="lbarin">
    <div id="lprev"><img id="lpimg" alt=""><button id="lrm">Remove</button></div>
    <div id="lrow">
      <button class="ic" id="latt" aria-label="Attach image">+</button>
      <textarea id="lin" rows="1" placeholder="Message"></textarea>
      <button class="pri" id="lsend">Send</button>
    </div>
    <input id="lfile" type="file" accept="image/*" hidden>
  </div>
</section>

<section class="panel on" id="p-files">
  <div id="bar1">
    <button class="soft" id="upd" aria-label="Up one folder">↑</button>
    <div id="crumb">/</div>
  </div>
  <div id="acts">
    <button id="upl">Send to PC</button>
    <button class="soft" id="mk">New folder</button>
    <button class="soft" id="rf">Refresh</button>
  </div>
  <div id="ups"></div>
  <div id="files"></div>
  <input type="file" id="pick" multiple hidden>
</section>

<section class="panel" id="p-term">
  <div id="out"></div>
  <div id="keys">
    <button data-k="c">Ctrl+C</button>
    <button data-k="d">Ctrl+D</button>
    <button data-k="up">↑</button>
    <button data-k="down">↓</button>
    <button data-k="clear">Clear</button>
    <button data-k="restart">Restart</button>
  </div>
  <div id="row">
    <input id="cmd" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="send" placeholder="command">
    <button id="go">Run</button>
  </div>
</section>

<div class="sheet" id="lset"><div class="card">
  <b>LLM settings</b>
  <textarea class="sys" id="lsys" placeholder="System prompt"></textarea>
  <label>Ask before running commands <input type="checkbox" class="sw" id="lask"></label>
  <div class="hint">Agent mode only. Off = the model runs commands and writes files on this PC without asking. Needs a model with tool support.</div>
  <label>Thinking <input type="checkbox" class="sw" id="lthink"></label>
  <div class="hint">Only affects models whose template supports it.</div>
  <label>Temperature <b id="ltv">0.8</b></label>
  <input type="range" id="ltemp" min="0" max="2" step="0.05" value="0.8">
  <button class="soft" id="lunload">Unload model</button>
  <button class="pri" id="lclose">Done</button>
</div></div>

<div class="sheet" id="ldrawer"><div class="card">
  <button id="lnew">+ New chat</button>
  <div id="lchats"></div>
</div></div>

<div id="login"><div class="box">
  <b>PC panel</b>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <div id="lerr"></div>
  <button id="unlock">Unlock</button>
</div></div>

<script>
const $=id=>document.getElementById(id);
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path,opt){
  const r=await fetch(path,opt);
  if(r.status===401&&path!=='/api/login'){$('login').style.display='flex';throw new Error('login required')}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||r.status);
  return d;
}
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b||{})});

/* ---------- login ---------- */
async function unlock(){
  $('lerr').textContent='';
  try{await post('/api/login',{password:$('pw').value});$('pw').value='';$('login').style.display='none';start()}
  catch(e){$('lerr').textContent=e.message}
}
$('unlock').onclick=unlock;
$('pw').onkeydown=e=>{if(e.key==='Enter')unlock()};

/* ---------- tabs ---------- */
function tab(n){
  for(const k of ['files','term','screen','llm']){$('t-'+k).classList.toggle('on',k===n);$('p-'+k).classList.toggle('on',k===n)}
  if(n==='term'){fit();$('out').scrollTop=1e9}
  if(n!=='screen')stopLive();
  if(n==='llm')$('llog').scrollTop=1e9;
}
$('t-screen').onclick=()=>tab('screen');
$('t-llm').onclick=()=>tab('llm');
$('t-files').onclick=()=>tab('files');
$('t-term').onclick=()=>{tab('term');$('cmd').focus()};

/* ---------- files ---------- */
let cwd='';
const join=(a,b)=>a?a+'/'+b:b;
const size=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB';
async function ls(p){
  const d=await api('/api/ls?path='+encodeURIComponent(p));
  cwd=d.path;$('crumb').textContent='/'+cwd;$('upd').disabled=!cwd;
  const F=$('files');F.innerHTML='';
  if(!d.items.length)F.innerHTML='<div class="empty">Empty folder</div>';
  for(const it of d.items){
    const row=document.createElement('div');row.className='row';
    const b=document.createElement('button');b.className='name';
    b.innerHTML=`<span>${E(it.name)}${it.dir?'/':''}</span><small>${it.dir?'folder':size(it.size)}</small>`;
    if(it.dir)b.onclick=()=>ls(join(cwd,it.name).replace(/^\//,''));
    row.appendChild(b);
    if(!it.dir){
      const a=document.createElement('a');a.className='btn soft';a.textContent='↓';a.setAttribute('aria-label','Download');
      a.href='/api/download?path='+encodeURIComponent(join(cwd,it.name));a.setAttribute('download',it.name);row.appendChild(a);
    }
    const x=document.createElement('button');x.className='x';x.textContent='✕';x.setAttribute('aria-label','Delete');
    x.onclick=async()=>{if(!confirm('Delete '+it.name+(it.dir?' and everything in it?':'?')))return;
      try{await post('/api/delete',{path:join(cwd,it.name)});ls(cwd)}catch(e){alert(e.message)}};
    row.appendChild(x);F.appendChild(row);
  }
}
$('upd').onclick=()=>ls(cwd.split('/').slice(0,-1).join('/'));
$('rf').onclick=()=>ls(cwd);
$('mk').onclick=async()=>{const n=prompt('Folder name');if(!n)return;
  try{await post('/api/mkdir',{path:cwd,name:n});ls(cwd)}catch(e){alert(e.message)}};
$('upl').onclick=()=>$('pick').click();
$('pick').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';
  const dest=cwd;
  await Promise.all(files.map(f=>new Promise(res=>{
    const el=document.createElement('div');el.className='up';
    el.innerHTML=`<div>${E(f.name)} · ${size(f.size)}</div><div class="bar"><i></i></div>`;$('ups').appendChild(el);
    const xhr=new XMLHttpRequest();
    xhr.open('POST','/api/upload?path='+encodeURIComponent(dest)+'&name='+encodeURIComponent(f.name));
    xhr.upload.onprogress=ev=>{if(ev.lengthComputable)el.querySelector('i').style.width=(ev.loaded/ev.total*100)+'%'};
    xhr.onload=()=>{el.firstChild.textContent=f.name+(xhr.status===200?' · done':' · failed');setTimeout(()=>el.remove(),xhr.status===200?1500:5000);res()};
    xhr.onerror=()=>{el.firstChild.textContent=f.name+' · failed';setTimeout(()=>el.remove(),5000);res()};
    xhr.send(f);
  })));
  ls(cwd);
};

/* ---------- terminal (small emulator: colors, \r overwrite, erase-line) ---------- */
const CSI=/\x1b\[[0-9;?<>=! ]*[@-~]/y, OSC=/\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)/y;
const T={cur:null,col:0,fg:'',bold:false,pend:'',es:null,hist:[],hi:0,lines:0};
const out=$('out');
function style(){return (T.fg+(T.bold?' b':'')).trim()}
function paint(L){
  let html='',run='',st=null;
  for(const [c,s] of L.cells){
    if(s!==st){if(run)html+=st?`<span class="${st}">${E(run)}</span>`:E(run);run='';st=s}
    run+=c;
  }

}
function newLine(){
  if(T.cur)paint(T.cur);
  const el=document.createElement('div');out.appendChild(el);
  T.cur={cells:[],el};T.col=0;
  if(++T.lines>3000){out.removeChild(out.firstChild);T.lines--}
}
function put(c){
  if(!T.cur)newLine();
  const cells=T.cur.cells;
  while(cells.length<T.col)cells.push([' ','']);
  cells[T.col++]=[c,style()];
}
function csi(seq){
  const f=seq[seq.length-1],raw=seq.slice(2,-1),ps=raw.split(';').map(x=>parseInt(x,10));
  const n=isNaN(ps[0])?null:ps[0];
  if(f==='m'){
    const a=raw===''?[0]:ps.map(x=>isNaN(x)?0:x);
    for(let k=0;k<a.length;k++){const p=a[k];
      if(p===0){T.fg='';T.bold=false}
      else if(p===1)T.bold=true;else if(p===22)T.bold=false;
      else if(p>=30&&p<=37)T.fg='f'+(p-30);
      else if(p>=90&&p<=97)T.fg='f'+(p-90+8);
      else if(p===39)T.fg='';
      else if(p===38||p===48){k+=a[k+1]===5?2:a[k+1]===2?4:0}
    }
  }else if(f==='K'){
    if(!T.cur)newLine();
    const c=T.cur.cells;
    if(!n)c.length=Math.min(c.length,T.col);
    else if(n===1){for(let k=0;k<T.col&&k<c.length;k++)c[k]=[' ','']}
    else if(n===2)c.length=0;
  }else if(f==='J'&&(n===2||n===3)){out.innerHTML='';T.cur=null;T.lines=0;T.col=0}
  else if(f==='C')T.col+=n||1;
  else if(f==='D')T.col=Math.max(0,T.col-(n||1));
  else if(f==='G')T.col=Math.max(0,(n||1)-1);
}
function feed(s){
  const near=out.scrollHeight-out.scrollTop-out.clientHeight<60;
  s=T.pend+s;T.pend='';
  for(let i=0;i<s.length;){
    const ch=s[i];
    if(ch==='\x1b'){
      if(i+1>=s.length){T.pend=s.slice(i);break}
      if(s[i+1]==='('||s[i+1]===')'){if(i+2>=s.length){T.pend=s.slice(i);break}i+=3;continue}
      CSI.lastIndex=i;let m=CSI.exec(s);
      if(m){csi(m[0]);i+=m[0].length;continue}
      OSC.lastIndex=i;m=OSC.exec(s);
      if(m){i+=m[0].length;continue}
      if(/^\x1b(\[[0-9;?<>=! ]*|\][^\x07]*)$/.test(s.slice(i))&&s.length-i<256){T.pend=s.slice(i);break}
      i+=2;continue;
    }
    i++;
    if(ch==='\n'){newLine()}
    else if(ch==='\r'){T.col=0}
    else if(ch==='\b'){T.col=Math.max(0,T.col-1)}
    else if(ch==='\t'){const t=8-(T.col%8);for(let k=0;k<t;k++)put(' ')}
    else if(ch>=' ')put(ch);
  }
  if(T.cur)paint(T.cur);
  if(near)out.scrollTop=out.scrollHeight;
}

async function run(){

function key(k){
  if(k==='c')post('/api/term/input',{data:'\x03'}).catch(()=>{});
  else if(k==='d')post('/api/term/input',{data:'\x04'}).catch(()=>{});
  else if(k==='up'){if(T.hi>0){T.hi--;$('cmd').value=T.hist[T.hi]}}

  else if(k==='clear'){out.innerHTML='';T.cur=null;T.lines=0;T.col=0;post('/api/term/input',{data:'\n'}).catch(()=>{})}
  else if(k==='restart'){startTerm(true).catch(e=>feed('['+e.message+']\n'))}
}

/* ---------- markdown: **bold**, *italic*, `code`, ``` blocks, tables ---------- */
function inl(s){
  s=E(s);const codes=[];
  s=s.replace(/`([^`\n]+)`/g,(_,c)=>{codes.push(c);return '\u0000'+(codes.length-1)+'\u0000'});
  s=s.replace(/\*\*([^*\n]+?)\*\*/g,'<strong>$1</strong>').replace(/__([^_\n]+?)__/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?![*\w])/g,'$1<em>$2</em>').replace(/(^|[^_\w])_([^_\s][^_\n]*?)_(?![_\w])/g,'$1<em>$2</em>');
  return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>'<code>'+codes[i]+'</code>');
}
const SEP=/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
const cells=r=>r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
function textBlock(t){
  const L=t.replace(/^\n|\n$/g,'').split('\n');let html='',i=0,prevBlock=false;
  while(i<L.length){
    if(L[i].includes('|')&&i+1<L.length&&SEP.test(L[i+1])){
      const head=cells(L[i]);i+=2;const rows=[];
      while(i<L.length&&L[i].trim()&&L[i].includes('|')){rows.push(cells(L[i]));i++}
      html+='<div class="tw"><table><thead><tr>'+head.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
      prevBlock=true;continue;
    }
    if(prevBlock&&!L[i].trim()){i++;prevBlock=false;continue}
    prevBlock=false;
    const hm=L[i].match(/^#{1,6}\s+(.*)$/);
    html+=(hm?'<strong>'+inl(hm[1])+'</strong>':inl(L[i]))+'<br>';i++;
  }
  return html.replace(/<br>$/,'');
}
function md(src){
  return src.split(/(```[\s\S]*?(?:```|$))/).map(p=>{
    if(p.startsWith('```')){
      const b=p.slice(3).replace(/^[^\n]*\n?/,'').replace(/```$/,'').replace(/\n$/,'');
      return '<pre><code>'+E(b)+'</code></pre>';
    }
    return textBlock(p);
  }).join('');
}

async function llmStream(am,el,msgs){
  const out=el.querySelector('.md'),L=$('llog');let dt=null,rs=null,n=0,gen=0;
  const body={model:chat.model,messages:msgs,stream:true,temperature:chat.temp,
    chat_template_kwargs:{enable_thinking:chat.think},stream_options:{include_usage:true}};
  if(chat.agent)body.tools=TOOLS;
  const r=await fetch('/api/llm/v1/chat/completions',{method:'POST',signal:lctl.signal,body:JSON.stringify(body)});
  if(r.status===401)$('login').style.display='flex';
  if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text().catch(()=>'')).slice(0,200));
  const rd=r.body.getReader(),dec=new TextDecoder(),tcs=[];let buf='';
  for(;;){
    const {done,value}=await rd.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n');buf=lines.pop();
    for(const l of lines){
      if(!l.startsWith('data: ')||l.includes('[DONE]'))continue;
      const o=JSON.parse(l.slice(6)),d=o.choices&&o.choices[0]&&o.choices[0].delta||{};
      if(d.reasoning_content){
        am.reasoning+=d.reasoning_content;
        if(!dt){dt=document.createElement('details');dt.open=true;dt.innerHTML='<summary>Thinking</summary>';rs=document.createElement('div');rs.style.whiteSpace='pre-wrap';dt.appendChild(rs);el.insertBefore(dt,out)}
        rs.textContent=am.reasoning;
      }
      if(d.content){if(dt)dt.open=false;am.content+=d.content;out.innerHTML=md(am.content)}
      for(const t of d.tool_calls||[]){
        const c=tcs[t.index||0]||(tcs[t.index||0]={id:'',type:'function',function:{name:'',arguments:''}});
        if(t.id)c.id=t.id;
        if(t.function){if(t.function.name&&!c.function.name)c.function.name=t.function.name;c.function.arguments+=t.function.arguments||''}
      }
      if(o.usage)n=o.usage.completion_tokens;
      if(o.timings){gen=o.timings.predicted_per_second;if(o.timings.predicted_n)n=o.timings.predicted_n}
      L.scrollTop=1e9;
    }
  }
  const calls=tcs.filter(Boolean);
  if(calls.length)am.tool_calls=calls.map((c,i)=>({...c,id:c.id||'call_'+Date.now().toString(36)+i}));
  return {n,gen};
}

  });
}
async function runTool(tc){
  const f=tc.function.name;let a={};
  try{a=JSON.parse(tc.function.arguments||'{}')}catch{return {label:f+' (bad arguments)',out:'Error: the arguments were not valid JSON.'}}
  const label=f==='run_command'?'$ '+a.command:f==='read_file'?'read '+a.path:f==='write_file'?'write '+a.path+' ('+String(a.content||'').length+' chars)':f;
  if(chat.ask!==false&&NEEDS_OK[f]&&!(await approve(label)))return {label:label+'  [skipped]',out:'The user declined to run this.'};
  const ph=document.createElement('div');ph.className='m t';ph.textContent='running '+label+' …';$('llog').appendChild(ph);$('llog').scrollTop=1e9;
  try{
    const d=await api('/api/agent/tool',{method:'POST',signal:lctl.signal,body:JSON.stringify({name:f,args:a})});
    return {label,out:d.output};
  }catch(e){return {label,out:'Error: '+e.message}}
  finally{ph.remove()}
}

/* ---------- send / stop: one reply, or (agent mode) a loop of reply -> tools -> reply ---------- */
function setBusy(b){lbusy=b;$('lsend').textContent=b?'Stop':'Send';$('lsend').classList.toggle('stop',b)}
async function lsend(){
  if(lbusy){lctl&&lctl.abort();askNow&&askNow();return}
  const text=$('lin').value.trim();
  if(!text&&!limg)return;
  if(!lready||!$('lmodel').value){$('lst').textContent=$('lmodel').value?'loading':'pick a model';return}
  chat.model=$('lmodel').value;
  chat.messages.push({role:'user',content:text,img:limg});
  if(chat.title==='New chat')chat.title=(text||'Image').slice(0,40);
  $('lin').value='';$('lin').style.height='auto';clearImg();render();
  lctl=new AbortController();setBusy(true);
  const L=$('llog'),max=chat.agent?MAX_STEPS:1;let go=true;
  for(let step=0;go&&step<max;step++){
    const msgs=toApi(),am={role:'assistant',content:'',reasoning:''};
    chat.messages.push(am);const el=bubble(am);L.appendChild(el);L.scrollTop=1e9;
    const t0=performance.now();let r={n:0,gen:0};
    try{r=await llmStream(am,el,msgs)}
    catch(e){go=false;if(e.name==='AbortError')am.meta='stopped';else am.content+=(am.content?'\n\n':'')+'Request failed: '+e.message}
    const sec=(performance.now()-t0)/1000,n=r.n||Math.round((am.content.length+am.reasoning.length)/4);
    am.meta=(am.meta?am.meta+' · ':'')+`${n} tokens · ${(r.gen||n/sec).toFixed(1)} t/s`;
    stats(n,sec,r.gen);
    if(!am.content&&!am.reasoning&&!am.tool_calls)chat.messages.pop();
    if(!go||!am.tool_calls)break;
    for(const tc of am.tool_calls){  // every call needs a result, or the next request is invalid
      const res=lctl.signal.aborted?{label:tc.function.name+'  [cancelled]',out:'Cancelled by the user.'}:await runTool(tc);
      const tm={role:'tool',tool_call_id:tc.id,label:res.label,content:res.out};
      chat.messages.push(tm);L.appendChild(bubble(tm));L.scrollTop=1e9;
    }
    if(lctl.signal.aborted)go=false;
  }
  if(go&&chat.agent&&chat.messages[chat.messages.length-1].role==='tool')
    chat.messages.push({role:'assistant',content:'Stopped after '+MAX_STEPS+' steps. Send "continue" to go on.'});
  setBusy(false);lctl=null;save();render();
}
$('lsend').onclick=lsend;
$('lin').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&innerWidth>700){e.preventDefault();lsend()}};
async function llmInit(){
  chat=newChat();await loadModels();
  const last=localStorage.getItem('llast');
  try{if(last)await openChat(last);else render()}catch{render()}
}

/* ---------- themes: oled (default), glass (Liquid Glass), tty ---------- */
const THEMES=['oled','glass','tty'];
function setTheme(t){
  document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);$('thm').textContent=t;
  document.querySelector('meta[name=theme-color]').content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#000';
}
$('thm').onclick=()=>setTheme(THEMES[(THEMES.indexOf(document.documentElement.dataset.theme)+1)%THEMES.length]);
setTheme(THEMES.includes(localStorage.getItem('theme'))?localStorage.getItem('theme'):'oled');

/* ---------- boot ---------- */
let started=false;
async function start(){
  if(started)return;started=true;
  try{sinfo=await api('/api/screen/info');$('snap').disabled=!sinfo.shot;$('live').disabled=!sinfo.stream;
    if(!sinfo.shot)smsg('No screenshot tool on the PC. Install ffmpeg (or maim).')}catch(e){}
  try{await ls('')}catch(e){}
  try{await startTerm(false)}catch(e){}
  try{PCROOT=(await api('/api/auth')).root}catch(e){}
  try{await llmInit()}catch(e){}
}
api('/api/auth').then(()=>{$('login').style.display='none';start()}).catch(()=>{$('login').style.display='flex';$('pw').focus();if(window.DEBUG_NO_LOGIN)start()});
